name: Build M2 Vulkan diagnostics (compile validation)

on:
  workflow_dispatch:
  push:
    branches: [m2-optimization-roadmap]
    paths:
      - 'scripts/apply-m2-vulkan-diagnostics.py'
      - '.github/workflows/build-m2-vulkan-diagnostics.yml'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out M2 build kit
        uses: actions/checkout@v4

      - name: Verify Apple build host
        run: |
          sw_vers
          xcodebuild -version
          uname -m

      - name: Download and verify pinned MeloNX source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-archive
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/RipeStore/Melons/releases/download/2026.10.11/MeloNX-2026.10.11.7z" \
            -o source-archive/MeloNX-2026.10.11.7z
          echo "ffd1d09402bb9e0ca27c872fe4f70ccefeedeb5c3a9882780fb9978729e8f951  source-archive/MeloNX-2026.10.11.7z" | shasum -a 256 -c -
          if ! command -v 7zz >/dev/null 2>&1; then
            brew install sevenzip
          fi
          7zz x source-archive/MeloNX-2026.10.11.7z -osource-archive/extracted
          SOURCE_DIR="$(find source-archive/extracted -type f -name global.json -print -quit | xargs dirname)"
          test -n "$SOURCE_DIR"
          mv "$SOURCE_DIR" source
          test -f source/global.json
          echo "13700519f3abc4e6d7ed8a065b118b2cc59bcd67" > source-commit.txt
          find source -name '*.xcodeproj' -o -name '*.xcworkspace' 2>/dev/null | tee apple-projects.txt
          PROJECT="$(find source -name 'MeloNX.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then PROJECT="$(find source -name '*.xcodeproj' -print -quit)"; fi
          PROJECT="${PROJECT#source/}"
          test -n "$PROJECT"
          echo "IOS_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          cat source/global.json

      - name: Apply diagnostic-only source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-m2-vulkan-diagnostics.py
          git -C source diff --check
          git -C source diff -- src/Ryujinx.Graphics.Vulkan/PipelineCacheManager.cs | tee diagnostic-source-diff.txt

      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      # The pinned Ryujinx.LibHac prerelease has moved between package feeds.
      - name: Select pinned LibHac feed
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*Include="Ryujinx.LibHac" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)"
          test -n "$version"
          for feed in \
            "https://starforgejo.dev/api/packages/Ryulynx/nuget" \
            "https://git.ryujinx.app/api/packages/projects/nuget" \
            "https://git.ryujinx.app/api/packages/ryubing/nuget"
          do
            if curl -fsSL -m 30 "$feed/registration/ryujinx.libhac/index.json" | grep -q "\"$version\""; then
              echo "Using $feed for Ryujinx.LibHac $version"
              sed -i '' "s#<add key=\"LibHacAlpha\" value=\"[^\"]*\"#<add key=\"LibHacAlpha\" value=\"$feed/index.json\"#" nuget.config
              exit 0
            fi
          done
          echo "Building Ryujinx.LibHac $version from pinned source"
          git clone -q https://starforgejo.dev/archive/LibHac_Ryubing.git "$RUNNER_TEMP/libhac"
          git -C "$RUNNER_TEMP/libhac" checkout -q 23e402ebb6dedc517e34a98a033078dc0f6fd478
          (cd "$RUNNER_TEMP/libhac" && ./build.sh Codegen)
          test -f "$RUNNER_TEMP/libhac/src/LibHac/Common/ResultNameResolver.Generated.cs"
          dotnet pack "$RUNNER_TEMP/libhac/src/LibHac/LibHac.csproj" -c Release -p:Version="$version" -o "$RUNNER_TEMP/libhac-feed"
          sed -i '' "s#<add key=\"LibHacAlpha\" value=\"[^\"]*\"#<add key=\"LibHacAlpha\" value=\"$RUNNER_TEMP/libhac-feed\"#" nuget.config
      - name: Install pinned .NET SDK and iOS workload
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          dotnet workload install ios
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Resolve Xcode packages
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_BIN="$(command -v dotnet)"
          echo "dotnet binary: $DOTNET_BIN"
          test -x "$DOTNET_BIN"
          echo "$(dirname "$DOTNET_BIN")" >> "$GITHUB_PATH"
          xcodebuild -list -project "$IOS_PROJECT"
          xcodebuild -resolvePackageDependencies -project "$IOS_PROJECT"

      - name: Archive diagnostic build (no signing)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          DOTNET_BIN="$(command -v dotnet)"
          test -x "$DOTNET_BIN"
          export PATH="$(dirname "$DOTNET_BIN"):$PATH"
          export DOTNET_ROOT="$HOME/.dotnet"
          echo "Build PATH=$PATH"
          command -v dotnet
          dotnet --version
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MeloNX-M2-diagnostics.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/melonx-m2-diagnostics-xcodebuild.log"

      - name: Preserve build diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          cp "$RUNNER_TEMP/melonx-m2-diagnostics-xcodebuild.log" build-diagnostics/ 2>/dev/null || true
          cp diagnostic-source-diff.txt build-diagnostics/ 2>/dev/null || true
          cp source-commit.txt build-diagnostics/ 2>/dev/null || true
          cp apple-projects.txt build-diagnostics/ 2>/dev/null || true

      - name: Upload compile validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-M2-diagnostics-compile-validation
          path: build-diagnostics/
          if-no-files-found: ignore
          retention-days: 30
