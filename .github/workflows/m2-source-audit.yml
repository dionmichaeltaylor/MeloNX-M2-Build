name: M2 source pipeline audit

on:
  workflow_dispatch:
  push:
    branches: [m2-optimization-roadmap]
    paths:
      - '.github/workflows/m2-source-audit.yml'
      - 'scripts/audit-pipeline-cache.sh'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out M2 build kit
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check out pinned official MeloNX source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://starforgejo.dev/projects/MeloNX.git source
          cd source
          git checkout 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          test "$(git rev-parse HEAD)" = "13700519f3abc4e6d7ed8a065b118b2cc59bcd67"
          git rev-parse HEAD > ../source-commit.txt
          git submodule status --recursive > ../source-submodules.txt

      - name: Run source pipeline-cache inventory
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/audit-pipeline-cache.sh source m2-pipeline-audit
          echo '=== AUDIT REPORT FILES ==='
          find m2-pipeline-audit -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1 ---"; sed -n "1,240p" "$1"' _ {} \;
          echo '=== PIPELINE CACHE MANAGER (130-320) ==='
          sed -n '130,320p' source/src/Ryujinx.Graphics.Vulkan/PipelineCacheManager.cs
          echo '=== BACKGROUND SCHEDULER ==='
          sed -n '1,180p' source/src/Ryujinx.Graphics.Vulkan/BackgroundCompilationScheduler.cs
          echo '=== PIPELINE COMPILE SCHEDULING (680-790) ==='
          sed -n '680,790p' source/src/Ryujinx.Graphics.Vulkan/ShaderCollection.cs
          echo '=== RENDERER CACHE INITIALIZATION / SHUTDOWN ==='
          sed -n '530,590p' source/src/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs
          sed -n '1110,1170p' source/src/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs
          echo '=== PIPELINE CACHE CAPABILITY IMPLEMENTATION ==='
          rg -n -C 8 'SupportsPipelineCreationCacheControl|PipelineCreationCacheControl' source/src/Ryujinx.Graphics.Vulkan source/src
          echo '=== PIPELINE CREATION CONTROL PATH ==='
          sed -n '1810,1905p' source/src/Ryujinx.Graphics.Vulkan/PipelineBase.cs
          echo '=== GPU DEVICE / EXTENSION LOGGING ==='
          rg -n -C 4 'PhysicalDeviceProperties|DriverVersion|DeviceName|IsMoltenVk|EnabledExtension|ExtensionProperties' source/src/Ryujinx.Graphics.Vulkan/VulkanRenderer.cs source/src/Ryujinx.Graphics.Vulkan/VulkanPhysicalDevice.cs
          echo '=== WORKER QUEUE POLICY ==='
          rg -n -C 6 'class WorkerQueue|Schedule\(|demanded|highPriority' source/src/Ryujinx.Graphics.Vulkan/WorkerQueue.cs source/src/Ryujinx.Graphics.Vulkan/BackgroundCompilationScheduler.cs

      - name: Upload source audit
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-M2-source-pipeline-audit
          path: |
            m2-pipeline-audit/
            source-commit.txt
            source-submodules.txt
          if-no-files-found: error
          retention-days: 30
