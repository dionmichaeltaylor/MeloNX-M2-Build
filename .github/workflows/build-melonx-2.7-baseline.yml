name: Build MeloNX 2.7 baseline (official source)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Verify Apple build host
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          uname -m

      - name: Clone official MeloNX 2.7 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://starforgejo.dev/projects/MeloNX.git source
          cd source
          git checkout 13700519f3abc4e6d7ed8a065b118b2cc59bcd67
          git submodule update --init --recursive
          test "$(git rev-parse HEAD)" = "13700519f3abc4e6d7ed8a065b118b2cc59bcd67"
          echo "=== Source root ==="
          ls -la
          echo "=== Xcode projects ==="
          find src distribution -name '*.xcodeproj' -o -name '*.xcworkspace' 2>/dev/null | tee ../apple-projects.txt
          echo "=== iOS build scripts ==="
          find distribution -maxdepth 5 -type f 2>/dev/null | sort | tee ../distribution-files.txt
          PROJECT="$(find src distribution -name 'MeloNX.xcodeproj' -print -quit)"
          if [ -z "$PROJECT" ]; then
            PROJECT="$(find src distribution -name '*.xcodeproj' -print -quit)"
          fi
          test -n "$PROJECT"
          echo "IOS_PROJECT=$PROJECT" >> "$GITHUB_ENV"
          git rev-parse HEAD | tee ../source-commit.txt
          cat global.json

      - name: Repair migrated LibHac NuGet feed URL
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          OLD='https://git.ryujinx.app/api/v4/projects/17/packages/nuget/index.json'
          NEW='https://git.ryujinx.app/api/packages/projects/nuget/index.json'
          if ! grep -Fq "$OLD" nuget.config; then
            echo "Expected legacy LibHac feed URL was not found; refusing to guess."
            exit 1
          fi
          sed -i '' "s#$OLD#$NEW#g" nuget.config
          echo "=== Effective LibHac feed ==="
          grep -n 'LibHacAlpha' nuget.config
          curl --fail --silent --show-error --location "$NEW" -o "$RUNNER_TEMP/libhac-nuget-index.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("LibHac feed index is valid JSON; resources:", len(d.get("resources", [])))' "$RUNNER_TEMP/libhac-nuget-index.json"

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: source/global.json

      - name: Install iOS workload
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          echo "Using repository-pinned SDK: $(dotnet --version)"
          dotnet --info
          dotnet workload install ios
          dotnet workload list
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Resolve Xcode packages
        working-directory: source
        run: |
          xcodebuild -list -project "$IOS_PROJECT"
          xcodebuild -resolvePackageDependencies -project "$IOS_PROJECT"

      - name: Archive untouched 2.7 source
        working-directory: source
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$IOS_PROJECT" \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MeloNX-2.7-baseline.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/melonx-2.7-xcodebuild.log"

      - name: Preserve build diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$GITHUB_WORKSPACE/build-diagnostics"
          if [ -f "$RUNNER_TEMP/melonx-2.7-xcodebuild.log" ]; then
            cp "$RUNNER_TEMP/melonx-2.7-xcodebuild.log" "$GITHUB_WORKSPACE/build-diagnostics/"
          fi
          if [ -d "$RUNNER_TEMP/MeloNX-2.7-baseline.xcarchive" ]; then
            echo "Archive directory exists" > "$GITHUB_WORKSPACE/build-diagnostics/archive-status.txt"
          else
            echo "Archive directory was not created" > "$GITHUB_WORKSPACE/build-diagnostics/archive-status.txt"
          fi

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-build-diagnostics
          path: build-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Package IPA and capture binary fingerprints
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/MeloNX-2.7-baseline.xcarchive/Products/Applications/MeloNX.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa-root/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa-root/Payload/MeloNX.app"
          (cd "$RUNNER_TEMP/ipa-root" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/MeloNX-2.7-baseline-unsigned.ipa" Payload)
          shasum -a 256 "$GITHUB_WORKSPACE/MeloNX-2.7-baseline-unsigned.ipa" > "$GITHUB_WORKSPACE/MeloNX-2.7-baseline-unsigned.ipa.sha256"
          find "$APP" -type f \( -name MeloNX -o -name Ryujinx.Library.dylib -o -name BreakpointJIT -o -name MeloNXRamDonor \) -exec shasum -a 256 {} \; > "$GITHUB_WORKSPACE/binary-fingerprints.txt"
          ditto "$RUNNER_TEMP/melonx-2.7-xcodebuild.log" "$GITHUB_WORKSPACE/melonx-2.7-xcodebuild.log"

      - name: Upload baseline and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-official-source-baseline
          path: |
            MeloNX-2.7-baseline-unsigned.ipa
            MeloNX-2.7-baseline-unsigned.ipa.sha256
            binary-fingerprints.txt
            source-commit.txt
            melonx-2.7-xcodebuild.log
            apple-projects.txt
            distribution-files.txt
          if-no-files-found: error
          retention-days: 30
